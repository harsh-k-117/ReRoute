[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reroute"
version = "0.1.0"
description = "Explainable dynamic fleet and delivery replanning"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
reroute = "scripts.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6,<7",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.optional-dependencies]
bench = ["ortools>=9.10,<10"]
llm = ["anthropic>=0.34,<1"]

[tool.hatch.build.targets.wheel]
packages = ["api", "contract", "data", "diff", "engine", "nlp", "replan", "verify"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "acceptance: end-to-end acceptance tests",
  "edge: edge-case tests",
  "property: property-based tests",
  "slow: tests excluded from the default check",
]
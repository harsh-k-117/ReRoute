# Lane: ALL. Stack: GitHub Actions · uv · Python 3.12 · pnpm · Node LTS. Gate = make check
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: make install
      - run: make check
